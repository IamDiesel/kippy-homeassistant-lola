[tool.pylint.master]
ignore = ["tests"]

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "missing-function-docstring",
    "too-many-locals",
    "too-many-statements",
    "unused-argument",
    "too-many-instance-attributes",
    "abstract-method",
    "too-many-branches",
    "protected-access",
    "no-member",
    "duplicate-code",
]

[tool.ruff]
exclude = ["AGENTS.md"]

[tool.ruff.lint]
ignore = [
    "RUF100",  # Unused noqa directives
    "UP031",  # %-formatting instead of f-strings in aoutdated tests
    "DTZ001",  # datetime without timezone
    "DTZ005",  # datetime.now() no timezone
    "DTZ011",  # date.today() instead of datetime.now().date()
    "SIM102",  # nested if-Statements
    "SIM114",  # if-Statements with same body
    "SIM117",  # nested with-Statements
    "TRY003",  # Exception-Text too long
]
